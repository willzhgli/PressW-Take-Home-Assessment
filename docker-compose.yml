services:
  server:
    build: ./server
    ports:
      - "3000:3000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY in .env (see .env.example)}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      PORT: "3000"

  web:
    build: ./web
    ports:
      - "5173:5173"
    depends_on:
      - server
